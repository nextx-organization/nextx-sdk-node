# Verifies generated code matches openapi.json, then builds and tests on Node 18/20/22.
name: ci
on:
  push: { branches: [main, next] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy: { matrix: { node: [18, 20, 22] } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Generated code matches openapi.json
        run: |
          [ "$(shasum -a 256 openapi.json | cut -c1-64)" = "$(node -p 'require("./package.json").nextx.specSha256')" ] || { echo "::error::openapi.json does not match package.json"; exit 1; }
          npm run gen && git diff --exit-code -- src/schema.d.ts
      - run: npm run build
      - run: npm test
