# Publishes to npm via trusted publishing (OIDC) with provenance.
#   tag vX.Y.Z on main  -> stable release, dist-tag "latest", GitHub Release
#   branch next         -> prerelease X.Y.Z-beta.N, dist-tag "beta"
name: release
on:
  push:
    tags: ["v*"]
    branches: [next]
permissions: { contents: read }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@11.6.2
      - name: Resolve version
        id: v
        run: |
          v=$(node -p 'require("./package.json").version'); n=$(node -p 'require("./package.json").name')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
            case "$v" in *-*) echo "::error::stable tag with a prerelease version"; exit 1;; esac
            tag=latest
          else
            case "$v" in *-beta.*) ;; *) echo "::error::branch next requires a -beta.N version (got $v)"; exit 1;; esac
            tag=beta
          fi
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "$n@$v already published"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run gen && git diff --exit-code -- src/schema.d.ts
      - run: npm run build && npm test
      - name: Publish
        if: steps.v.outputs.skip != '1'
        run: |
          if [ "${{ vars.PUBLISH_ENABLED }}" = true ]; then
            npm publish --provenance --access public --tag "${{ steps.v.outputs.tag }}"
          else
            npm publish --dry-run --access public --tag "${{ steps.v.outputs.tag }}"
          fi
      - name: GitHub Release
        if: github.ref_type == 'tag' && vars.PUBLISH_ENABLED == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          npm pack --silent >/dev/null; shasum -a 256 *.tgz > SHA256SUMS
          v=${{ steps.v.outputs.version }}
          awk -v v="$v" '$0 ~ "^## "v"( |$)"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" *.tgz SHA256SUMS --title "v$v" --notes-file notes.md --verify-tag
